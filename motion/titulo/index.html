<!doctype html>
<!--
  Título de bloco do Legend AI Edit (sobreposição com transparência).
  Terço de cima, à esquerda: selo pequeno + barra de destaque + título revelado palavra a palavra.
  Duração: 90 quadros a 29,97 fps -> (90 - 0,5) / 29,97 = 2.986 s.
  Variáveis: titulo, selo. Render: scripts/motion.py (ou npx hyperframes render ... --variables).
-->
<html lang="pt-BR" data-resolution="landscape" data-composition-variables='[
  {"id":"titulo","type":"string","label":"Título","default":"TÍTULO DO BLOCO"},
  {"id":"selo","type":"string","label":"Selo acima do título","default":"Nome do canal"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ink: #ffffff; --accent: #f5b942; --shadow: rgba(0, 0, 0, 0.55); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      /* safe area: 5% from the edges; block sits in the top third */
      #block { position: absolute; left: 96px; top: 120px; display: flex; gap: 22px; align-items: stretch; }
      #bar { width: 10px; border-radius: 5px; background: var(--accent); transform-origin: 50% 0%;
             box-shadow: 0 2px 10px var(--shadow); }
      #text { display: flex; flex-direction: column; gap: 10px; }
      #selo { overflow: hidden; }
      #selo span { display: inline-block; color: var(--accent); font-size: 30px; font-weight: 700; letter-spacing: 0.02em;
                   text-shadow: 0 2px 8px var(--shadow); }
      #titulo { display: flex; flex-wrap: wrap; column-gap: 24px; row-gap: 4px; max-width: 1150px; }
      .w { display: inline-block; overflow: hidden; padding: 0.12em 0.08em 0.14em; margin: -0.12em -0.08em -0.14em; }
      .w span { display: inline-block; color: var(--ink); font-size: 84px; font-weight: 800; letter-spacing: -0.02em;
                line-height: 1.2; text-shadow: 0 3px 14px var(--shadow), 0 1px 2px rgba(0,0,0,.6); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.986" data-width="1920" data-height="1080"
         data-motion-blur="on" data-motion-blur-tier="filter">
      <div id="block" class="clip" data-start="0" data-duration="2.986" data-track-index="0">
        <div id="bar"></div>
        <div id="text">
          <div id="selo"><span></span></div>
          <div id="titulo"></div>
        </div>
      </div>
    </div>
    <script>
      const { titulo, selo } = window.__hyperframes.getVariables();
      const seloEl = document.querySelector("#selo span");
      seloEl.textContent = selo || "";
      if (!selo) document.querySelector("#selo").style.display = "none";
      const box = document.querySelector("#titulo");
      for (const word of String(titulo).trim().split(/\s+/)) {
        const w = document.createElement("span"); w.className = "w";
        const inner = document.createElement("span"); inner.textContent = word;
        w.append(inner); box.append(w);
      }
      const words = [...document.querySelectorAll(".w span")];
      const tl = gsap.timeline({ paused: true });
      // in: bar draws, label slides, words rise one by one (fast in, soft landing)
      tl.set("#bar", { transformOrigin: "50% 0%" }, 0);
      tl.fromTo("#bar", { scaleY: 0 }, { scaleY: 1, duration: 0.32, ease: "power3.out", lazy: false }, 0);
      tl.fromTo(seloEl, { yPercent: 110 }, { yPercent: 0, duration: 0.3, ease: "power3.out", lazy: false }, 0.08);
      words.forEach((el, i) => {
        tl.fromTo(el, { yPercent: 115 }, { yPercent: 0, duration: 0.38, ease: "power4.out", lazy: false }, 0.14 + i * 0.07);
      });
      // out: everything leaves upwards, bar retracts last
      const out = 2.986 - 0.42;
      tl.fromTo([seloEl, ...words], { yPercent: 0 }, { yPercent: -115, duration: 0.28, ease: "power3.in", stagger: 0.03,
                 immediateRender: false, lazy: false }, out);
      tl.set("#bar", { transformOrigin: "50% 100%" }, out + 0.12);
      tl.fromTo("#bar", { scaleY: 1 }, { scaleY: 0, duration: 0.24, ease: "power3.in", immediateRender: false, lazy: false }, out + 0.12);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
