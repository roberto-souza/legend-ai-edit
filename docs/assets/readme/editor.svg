<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">O editor de linha do tempo</title>
  <desc id="d">Esboço do editor no navegador: player no centro, biblioteca de clipes à esquerda, inspetor à direita e, embaixo, as trilhas de apoio, vídeo e áudio com os cortes coloridos e o cursor vermelho.</desc>
  <rect width="1200" height="340" rx="14" fill="#141416"/>
  <rect x="10" y="10" width="1180" height="320" rx="10" fill="none" stroke="#c9a227" stroke-opacity=".5" stroke-width="2"/>
  <g font-family="-apple-system, 'Helvetica Neue', sans-serif">
