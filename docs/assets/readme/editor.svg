    <text x="562" y="190" font-size="13" text-anchor="middle" fill="#fff" font-weight="700">Dia de <tspan fill="#f5b942">gravação</tspan> do Palanque</text>

    <rect x="924" y="70" width="246" height="140" rx="6" fill="#1c1c20"/>
    <g fill="#8b8b96" font-size="11"><text x="938" y="90">CORTE · 0021</text><text x="938" y="112">Zoom</text><text x="938" y="140">Transição</text><text x="938" y="168">Título</text></g>
    <g fill="#232328"><rect x="1010" y="100" width="146" height="18" rx="4"/><rect x="1010" y="128" width="146" height="18" rx="4"/><rect x="1010" y="156" width="146" height="18" rx="4"/></g>
    <g fill="#e8e8ec" font-size="11"><text x="1018" y="113">1,12× → 1,16×</text><text x="1018" y="141">punch-in</text><text x="1018" y="169">TARDE DE GRAVAÇÃO</text></g>

    <rect x="30" y="222" width="1140" height="96" rx="6" fill="#1c1c20"/>
