<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Da oficina à sua máquina</title>
  <desc id="d">Quatro peças ligadas por setas: o repositório do Legend AI Edit; o scripts/setup.sh, que instala ffmpeg-full, uv, o modelo do Whisper e o HyperFrames; a pasta aberta no Claude Code; e a skill /editar-video, que conduz as etapas.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ecd2"/>
      <stop offset="1" stop-color="#e6d3a6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a1f2b"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="14" fill="url(#paper)"/>
  <rect x="10" y="10" width="1180" height="280" rx="10" fill="none" stroke="#7a1f2b" stroke-width="2" stroke-dasharray="2 6"/>
  <text x="600" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#5e1520">Da oficina à sua máquina</text>

  <g font-family="Georgia, serif" text-anchor="middle">
    <g transform="translate(160 160)">
      <rect x="-115" y="-58" width="230" height="116" rx="10" fill="#5e1520" stroke="#c9a227" stroke-width="3"/>
      <text y="-18" font-size="20" font-weight="700" fill="#f1d27a">Repositório</text>
      <text y="10" font-size="15" fill="#f3e7c9">git clone</text>
      <text y="32" font-size="13" fill="#f3e7c9" opacity=".85">~/Movies/legend-ai-edit</text>
    </g>
    <g transform="translate(450 160)">
      <rect x="-125" y="-58" width="250" height="116" rx="10" fill="#f3e7c9" stroke="#7a1f2b" stroke-width="3"/>
      <text y="-22" font-size="20" font-weight="700" fill="#5e1520">scripts/setup.sh</text>
      <text y="4" font-size="14" fill="#3b2a1a">ffmpeg-full · uv · Whisper</text>
      <text y="26" font-size="14" fill="#3b2a1a">HyperFrames (motion)</text>
    </g>
    <g transform="translate(750 160)">
      <rect x="-115" y="-58" width="230" height="116" rx="10" fill="#f3e7c9" stroke="#7a1f2b" stroke-width="3"/>
      <text y="-18" font-size="20" font-weight="700" fill="#5e1520">Claude Code</text>
      <text y="10" font-size="14" fill="#3b2a1a">aberto na pasta</text>
      <text y="32" font-size="13" fill="#3b2a1a" opacity=".85">CLAUDE.md + .memoria/</text>
    </g>
    <g transform="translate(1040 160)">
      <rect x="-115" y="-58" width="230" height="116" rx="10" fill="#7a1f2b" stroke="#c9a227" stroke-width="3"/>
      <text y="-18" font-size="20" font-weight="700" fill="#f1d27a">/editar-video</text>
      <text y="10" font-size="14" fill="#f3e7c9">conduz as etapas</text>
      <text y="32" font-size="13" fill="#f3e7c9" opacity=".85">e pede o seu "sim"</text>
    </g>
  </g>
  <g stroke="#7a1f2b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="278" y1="160" x2="318" y2="160"/>
    <line x1="578" y1="160" x2="628" y2="160"/>
    <line x1="868" y1="160" x2="918" y2="160"/>
  </g>
</svg>
