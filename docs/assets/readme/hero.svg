<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Legend AI Edit</title>
  <desc id="d">Brasão com escudo vinho e ouro, uma claquete e um lacre de play, sobre duas tiras de filme cruzadas, ao lado de um estandarte com o nome Legend AI Edit e o lema Oficina de Edição das Lendas da IA.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d14"/>
      <stop offset="1" stop-color="#4a2f1f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b2a37"/>
      <stop offset="1" stop-color="#5e1520"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d27a"/>
      <stop offset="1" stop-color="#b8891d"/>
    </linearGradient>
    <linearGradient id="film" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b211a"/>
      <stop offset=".5" stop-color="#4b3a2c"/>
      <stop offset="1" stop-color="#2b211a"/>
    </linearGradient>
    <pattern id="stars" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1.2" fill="#f1d27a" opacity=".35"/>
      <circle cx="44" cy="40" r="0.9" fill="#f3e7c9" opacity=".3"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="url(#sky)"/>
  <rect width="1200" height="420" fill="url(#stars)"/>
  <rect x="14" y="14" width="1172" height="392" rx="10" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <rect x="24" y="24" width="1152" height="372" rx="6" fill="none" stroke="#c9a227" stroke-opacity=".35" stroke-width="1"/>

  <!-- crossed film strips -->
  <g transform="translate(210 212) rotate(40)">
    <g id="strip">
      <rect x="-26" y="-190" width="52" height="330" rx="4" fill="url(#film)" stroke="#c9a227" stroke-width="2"/>
      <g fill="#f3e7c9" opacity=".9">
        <rect x="-21" y="-180" width="7" height="10" rx="1.5"/><rect x="14" y="-180" width="7" height="10" rx="1.5"/>
        <rect x="-21" y="-150" width="7" height="10" rx="1.5"/><rect x="14" y="-150" width="7" height="10" rx="1.5"/>
        <rect x="-21" y="-120" width="7" height="10" rx="1.5"/><rect x="14" y="-120" width="7" height="10" rx="1.5"/>
        <rect x="-21" y="70" width="7" height="10" rx="1.5"/><rect x="14" y="70" width="7" height="10" rx="1.5"/>
        <rect x="-21" y="100" width="7" height="10" rx="1.5"/><rect x="14" y="100" width="7" height="10" rx="1.5"/>
        <rect x="-21" y="125" width="7" height="10" rx="1.5"/><rect x="14" y="125" width="7" height="10" rx="1.5"/>
      </g>
      <rect x="-9" y="-112" width="18" height="24" rx="2" fill="#c9a227" opacity=".55"/>
      <rect x="-9" y="40" width="18" height="24" rx="2" fill="#c9a227" opacity=".55"/>
    </g>
  </g>
  <g transform="translate(210 212) rotate(-40)">
    <use href="#strip"/>
  </g>

  <!-- shield with clapperboard and play seal -->
  <path d="M150 100 h120 v90 c0 70 -60 110 -60 110 c0 0 -60 -40 -60 -110 z" fill="url(#shield)" stroke="url(#gold)" stroke-width="5"/>
  <g transform="translate(210 150)">
    <rect x="-30" y="-8" width="60" height="36" rx="3" fill="#f3e7c9"/>
    <g transform="rotate(-14 -30 -8)">
      <rect x="-30" y="-20" width="60" height="12" rx="2" fill="#f3e7c9"/>
      <g fill="#5e1520"><path d="M-24 -20 h9 l-6 12 h-9 z"/><path d="M-6 -20 h9 l-6 12 h-9 z"/><path d="M12 -20 h9 l-6 12 h-9 z"/></g>
    </g>
    <g stroke="#7a1f2b" stroke-width="2"><line x1="-22" y1="4" x2="22" y2="4"/><line x1="-22" y1="12" x2="16" y2="12"/><line x1="-22" y1="20" x2="10" y2="20"/></g>
  </g>
  <circle cx="210" cy="236" r="21" fill="#7a1f2b" stroke="#f1d27a" stroke-width="3"/>
  <path d="M203 225 v22 l18 -11 z" fill="#f1d27a"/>

  <!-- banner -->
  <path d="M370 150 h760 l-30 50 l30 50 h-760 l30 -50 z" fill="#f3e7c9" stroke="url(#gold)" stroke-width="4"/>
  <text x="750" y="219" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#5e1520" letter-spacing="2">Legend AI Edit</text>
  <text x="750" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#f1d27a">Oficina de Edição das Lendas da IA</text>
  <text x="750" y="345" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#f3e7c9" opacity=".85" letter-spacing="4">DO BRUTO AO 4K, UMA ETAPA APROVADA POR VEZ</text>
</svg>
